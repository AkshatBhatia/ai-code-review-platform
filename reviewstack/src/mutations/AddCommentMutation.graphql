mutation AddCommentMutation($id: ID!, $body: String!) {
  addComment(input: {subjectId: $id, body: $body}) {
    subject {
      id
    }
    commentEdge {
      cursor
      node {
        ... on IssueComment {
          __typename
          id
          author {
            ...ActorFragment
          }
          bodyHTML
        }
      }
    }
  }
}
